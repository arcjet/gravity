name: Build and test

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gravity:
    name: Gravity tests
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: always
    steps:
      # Environment security
      - name: Step Security
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          disable-sudo-and-containers: true
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            github.com:443
            index.crates.io:443
            static.crates.io:443
            static.rust-lang.org:443
            proxy.golang.org:443

      # Checkout
      # Most toolchains require checkout first
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Language toolchains
      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable

      # The runner image ships rustup. With no toolchain argument it installs
      # the toolchain, components and targets pinned in `rust-toolchain.toml`.
      - name: Install Rust
        run: rustup toolchain install --no-self-update

      - name: Inspect toolchain versions
        run: |
          cargo -V
          go version

      # Workflow

      - name: cargo fmt
        run: cargo fmt --all --check

      # Each wit-bindgen release requires one wit-component minor, and a build
      # that mixes two wit-parser versions fails with mismatched Resolve types.
      # Mirrors `just check-wit`.
      - name: one version of each wit crate
        run: |
          status=0
          for crate in wit-parser wit-component; do
            versions=$(awk -v name="\"$crate\"" '$1 == "name" && $3 == name { found = 1; next } found && $1 == "version" { print $3; found = 0 }' Cargo.lock | tr -d '"' | sort -u | paste -sd ' ' -)
            if [[ "$versions" == *" "* ]]; then
              echo "::error file=Cargo.lock::Cargo.lock holds $crate $versions. wit-bindgen, wit-bindgen-core and wit-component move as one set (see AGENTS.md): pin wit-component to the minor this wit-bindgen release requires."
              status=1
            fi
          done
          exit $status

      - name: cargo build
        run: cargo build --locked --verbose
        env:
          CARGO_TERM_COLOR: always

      - name: cargo test
        run: cargo test --locked --verbose
        env:
          CARGO_TERM_COLOR: always

      - name: go test
        run: |
          go generate ./...
          go test ./...

      - name: run snapshot tests
        run: cargo test --locked --verbose --test cli

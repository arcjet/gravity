name: Build and test

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The job only reads the repository: it checks out, builds and tests.
permissions:
  contents: read

jobs:
  gravity:
    name: Gravity tests
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: always
    steps:
      # Environment security
      - name: Step Security
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          disable-sudo-and-containers: true
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            github.com:443
            index.crates.io:443
            static.crates.io:443
            static.rust-lang.org:443
            proxy.golang.org:443

      # Checkout
      # Most toolchains require checkout first
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No later step pushes or calls the API, so the token stays out of
          # .git/config, where the build and `go generate` could read it.
          persist-credentials: false

      # Language toolchains
      - name: Install Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable

      # The runner image ships rustup. With no toolchain argument it installs
      # the toolchain, components and targets pinned in `rust-toolchain.toml`.
      - name: Install Rust
        run: rustup toolchain install --no-self-update

      - name: Inspect toolchain versions
        run: |
          cargo -V
          go version

      # Workflow

      - name: cargo fmt
        run: cargo fmt --all --check

      # Each wit-bindgen release requires one wit-component minor, and a build
      # that mixes two wit-parser versions fails with mismatched Resolve types.
      # Mirrors `just check-wit`.
      - name: one version of each wit crate
        run: |
          bash scripts/check-wit-test.sh
          bash scripts/check-wit.sh

      # A rerun-if-changed path that does not exist makes cargo recompile
      # gravity on every build. Mirrors `just check-build-script`.
      - name: build.rs rebuilds only when HEAD moves
        run: bash scripts/check-build-script.sh

      - name: cargo build
        run: cargo build --locked --verbose
        env:
          CARGO_TERM_COLOR: always

      - name: cargo test
        run: cargo test --locked --verbose
        env:
          CARGO_TERM_COLOR: always

      - name: go test
        run: |
          go generate ./...
          go test ./...

      - name: run snapshot tests
        run: cargo test --locked --verbose --test cli
